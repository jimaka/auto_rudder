   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 10.4px; font-family: 'Noto Sans CJK JP'; text-anchor: middle; fill: #17334d" x="628.135646" y="342.779467" transform="rotate(-0 628.135646 342.779467)">valid()</text>
