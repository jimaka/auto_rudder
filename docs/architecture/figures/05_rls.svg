   <g id="text_1">
    <text style="font-weight: 700; font-size: 10.4px; font-family: 'Noto Sans CJK JP'; text-anchor: middle; fill: #17334d" x="162.401416" y="154.066237" transform="rotate(-0 162.401416 154.066237)">输入检查</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8.7px; font-family: 'Noto Sans CJK JP'; text-anchor: middle; fill: #40596b" x="162.401416" y="175.218128" transform="rotate(-0 162.401416 175.218128)">r / delta 有限、幅值、dt &gt; 0</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10.4px; font-family: 'Noto Sans CJK JP'; text-anchor: middle; fill: #17334d" x="162.401416" y="248.365571" transform="rotate(-0 162.401416 248.365571)">累计时间</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.7px; font-family: 'Noto Sans CJK JP'; text-anchor: middle; fill: #40596b" x="162.401416" y="269.517462" transform="rotate(-0 162.401416 269.517462)">不足一拍 → return false</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 10.4px; font-family: 'Noto Sans CJK JP'; text-anchor: middle; fill: #17334d" x="162.401416" y="342.664904" transform="rotate(-0 162.401416 342.664904)">计算 dr 与激励门</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.7px; font-family: 'Noto Sans CJK JP'; text-anchor: middle; fill: #40596b" x="162.401416" y="363.830389" transform="rotate(-0 162.401416 363.830389)">舵角足够，且角速度/变化率足够</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 10.4px; font-family: 'Noto Sans CJK JP'; text-anchor: middle; fill: #17334d" x="395.268531" y="342.664904" transform="rotate(-0 395.268531 342.664904)">激励不足</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8.7px; font-family: 'Noto Sans CJK JP'; text-anchor: middle; fill: #40596b" x="395.268531" y="363.816795" transform="rotate(-0 395.268531 363.816795)">更新必要历史状态；不做 RLS</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 10.4px; font-family: 'Noto Sans CJK JP'; text-anchor: middle; fill: #17334d" x="162.401416" y="436.964237" transform="rotate(-0 162.401416 436.964237)">构造归一化回归量</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8.7px; font-family: 'Noto Sans CJK JP'; text-anchor: middle; fill: #40596b" x="162.401416" y="458.116128" transform="rotate(-0 162.401416 458.116128)">Nomoto 关系 + 尺度归一化</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 10.4px; font-family: 'Noto Sans CJK JP'; text-anchor: middle; fill: #17334d" x="395.268531" y="436.964237" transform="rotate(-0 395.268531 436.964237)">递推最小二乘</text>
   </g>
   <g id="text_12">
    <text style="font-size: 8.7px; font-family: 'Noto Sans CJK JP'; text-anchor: middle; fill: #40596b" x="395.268531" y="458.116128" transform="rotate(-0 395.268531 458.116128)">分母检查 → θ 更新 → P 更新</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 10.4px; font-family: 'Noto Sans CJK JP'; text-anchor: middle; fill: #17334d" x="628.135646" y="437.0788" transform="rotate(-0 628.135646 437.0788)">K() / T() / excited()</text>
   </g>
   <g id="text_14">
